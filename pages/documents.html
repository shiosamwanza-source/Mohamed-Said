<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documents Archive</title>

<style>
body{
    margin:0;
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    background:#111827;
    padding:25px;
    text-align:center;
}

h1{
    color:#fbbf24;
}

#documents{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:20px;
    padding:20px;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:12px;
}

button{
    background:#fbbf24;
    color:black;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    opacity:.9;
}
</style>

</head>
<body>

<header>
<h1>📄 Documents Archive</h1>
<p>Mohamed Said Digital Historical Archive</p>
</header>

<div id="documents"></div>

<script>

fetch("/data/metadata/documents.json")
.then(r=>r.json())
.then(data=>{

const container=document.getElementById("documents");

data.forEach(doc=>{

const card=document.createElement("div");
card.className="card";

card.innerHTML=`
<h2>${doc.title}</h2>

<p><b>Author:</b> ${doc.author}</p>

<p><b>Year:</b> ${doc.year}</p>

<p>${doc.description}</p>

<button>Open Document</button>
`;

card.querySelector("button").onclick=function(){
window.open("/"+doc.file,"_blank");
};

container.appendChild(card);

});

})
.catch(err=>{

document.getElementById("documents").innerHTML="<h2>Documents hazikupatikana.</h2>";

console.log(err);

});

</script>

</body>
</html>
