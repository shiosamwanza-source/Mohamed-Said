<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documents Archive</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:white;
}

header{
    background:#111827;
    padding:20px;
    text-align:center;
}

header h1{
    color:#fbbf24;
    margin:0;
}

#documents{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:20px;
    padding:20px;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:12px;
}

.card h2{
    color:#fbbf24;
}

button{
    background:#fbbf24;
    color:#000;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}
</style>
</head>

<body>

<header>
<h1>📄 Documents Archive</h1>
<p>Mohamed Said Digital Historical Archive</p>
</header>

<div id="documents"></div>

<script>

fetch("../data/metadata/documents.json")
.then(res=>res.json())
.then(data=>{

const container=document.getElementById("documents");

data.forEach(doc=>{

container.innerHTML += `
<div class="card">

<h2>${doc.title}</h2>

<p><b>Author:</b> ${doc.author}</p>

<p><b>Year:</b> ${doc.year}</p>

<p>${doc.description}</p>

<a href="../${doc.file}" target="_blank">
<button>Soma Document</button>
</a>

</div>
`;

});

})
.catch(err=>{
document.getElementById("documents").innerHTML="<h2>Documents hazijapatikana.</h2>";
console.error(err);
});

</script>

</body>
</html>
